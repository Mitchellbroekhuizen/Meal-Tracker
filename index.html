// Gemini API-sleutel: wordt alleen lokaal op dit apparaat bewaard (niet in de repo)
const API_KEY_STORAGE = 'nutripulse_gemini_key';
const GEMINI_MODEL = 'gemini-flash-latest';
function getApiKey() {
  try { return localStorage.getItem(API_KEY_STORAGE) || ''; } catch (e) { return ''; }
}
function setApiKey(key) {
  try {
    if (key) localStorage.setItem(API_KEY_STORAGE, key.trim());
    else localStorage.removeItem(API_KEY_STORAGE);
  } catch (e) {}
  window.dispatchEvent(new Event('apikey-changed'));
}
function geminiUrl() {
  const key = getApiKey();
  if (!key) throw new Error('GEEN_API_SLEUTEL');
  return `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(key)}`;
}
function aiErrorMessage(err, fallback) {
  const msg = String(err && err.message || '');
  if (msg === 'GEEN_API_SLEUTEL') return 'Vul eerst je Gemini API-sleutel in (bovenaan dit scherm).';
  if (/API Fout \((400|401|403)\)/.test(msg) && /key|API_KEY/i.test(msg)) return 'Je Gemini API-sleutel klopt niet. Controleer of je hem goed hebt geplakt.';
  if (/API Fout \(429\)/.test(msg)) return 'Te veel aanvragen bij Gemini. Wacht even en probeer het opnieuw.';
  if (msg === 'TIMEOUT') return 'Gemini reageert niet (time-out). Controleer je internet en probeer het opnieuw.';
  if (/API Fout/.test(msg)) return fallback + ' (' + msg.slice(0, 140) + ')';
  return fallback;
}

// Eén aanvraag met tijdslimiet, zodat hij nooit eindeloos blijft hangen
async function fetchOnce(url, options, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const response = await fetch(url, { ...options, signal: ctrl.signal });
    if (response.ok) return await response.json();
    const errText = await response.text();
    const err = new Error(`API Fout (${response.status}): ${errText.slice(0, 300)}`);
    err.status = response.status;
    throw err;
  } catch (err) {
    if (err.name === 'AbortError') {
      const t = new Error('TIMEOUT');
      t.status = 'timeout';
      throw t;
    }
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

// Probeert meerdere Gemini-modellen: valt terug als een model niet bestaat, overbelast is of te traag is
const GEMINI_FALLBACK_MODELS = ['gemini-flash-latest', 'gemini-2.5-flash', 'gemini-flash-lite-latest'];
async function fetchWithRetry(url, options) {
  const isGemini = url.includes('generativelanguage.googleapis.com');
  const urls = isGemini
    ? GEMINI_FALLBACK_MODELS.map(m => url.replace(/models\/[^:]+:/, `models/${m}:`))
    : [url];
  let lastErr = null;
  for (const u of urls) {
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        return await fetchOnce(u, options, 30000);
      } catch (err) {
        lastErr = err;
        console.warn('Gemini aanvraag mislukt:', u.split('?')[0], err.message);
        const s = err.status;
        // Sleutel of verzoek klopt niet: direct stoppen
        if (s === 400 || s === 401 || s === 403) throw err;
        // Model bestaat niet of is te traag: meteen volgende model
        if (s === 404 || s === 'timeout') break;
        // Overbelast / limiet: kort wachten en nog één keer
        if (attempt === 0) await new Promise(r => setTimeout(r, 1500));
      }
    }
  }
  throw lastErr || new Error('Onbekende fout');
}

// 1. Analyseer Foto van Maaltijd
async function analyzeMealImageWithGemini(base64Data, mimeType = "image/jpeg", extraNote = "") {
  const apiUrl = geminiUrl();
  
  const prompt = `Je bent een deskundige Nederlandse diëtist en voedingswetenschapper. Analyseer deze foto van een maaltijd of snack. 
  ${extraNote ? `Extra context van de gebruiker: "${extraNote}".` : ''}
  Herken alle ingrediënten op het bord/in beeld, schat het portiegewicht zo nauwkeurig mogelijk in, en bereken de totale voedingswaarde.
  Geef het antwoord uitsluitend terug volgens het opgegeven JSON schema in het Nederlands.`;

  const payload = {
    contents: [{
      role: "user",
      parts: [
        { text: prompt },
        { inlineData: { mimeType, data: base64Data } }
      ]
    }],
    generationConfig: {
      responseMimeType: "application/json",
      responseSchema: {
        type: "OBJECT",
        properties: {
          mealName: { type: "STRING", description: "Korte, duidelijke Nederlandse naam van de maaltijd" },
          estimatedPortion: { type: "STRING", description: "Geschatte portiegrootte (bijv. '1 bord (ca. 450g)')" },
          calories: { type: "NUMBER", description: "Totaal aantal kilocalorieën (kcal)" },
          protein: { type: "NUMBER", description: "Totaal gram eiwitten" },
          carbs: { type: "NUMBER", description: "Totaal gram koolhydraten" },
          fat: { type: "NUMBER", description: "Totaal gram vetten" },
          detectedItems: {
            type: "ARRAY",
            items: { type: "STRING" },
            description: "Lijst met gedetecteerde ingrediënten en hun geschatte gewicht"
          },
          healthTip: { type: "STRING", description: "Een korte, positieve voedingstip over deze maaltijd (1-2 zinnen)" },
          suggestedMealType: { 
            type: "STRING", 
            description: "Kies uit: Ontbijt, Lunch, Avondeten, Tussendoortje" 
          }
        },
        propertyOrdering: ["mealName", "estimatedPortion", "calories", "protein", "carbs", "fat", "detectedItems", "healthTip", "suggestedMealType"]
      }
    }
  };

  const result = await fetchWithRetry(apiUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!text) throw new Error("Kon geen analyse maken van de foto.");
  return JSON.parse(text);
}

    desc: "Bouw, stratenmaker, landbouw of zware lichamelijke arbeid",
    factor: 1.72
  }
};

const GOAL_TYPES = {
  cut_fast: {
    label: "Afvallen / Cutten (-500 kcal)",
    kcalDelta: -500,
    proteinPerKg: 2.1,
    fatPerKg: 0.85
  },
  cut_mild: {

  },
  maintain: {

  },

  }

function calculatePersonalNutrition(profileData) {
  const gender = profileData.gender || 'male';
  const age = Math.max(14, Math.min(100, Number(profileData.age) || 28));
  const weight = Math.max(35, Math.min(250, Number(profileData.weight) || 80));
  const height = Math.max(120, Math.min(230, Number(profileData.height) || 180));
  const workKey = WORK_ACTIVITY_LEVELS[profileData.workActivity] ? profileData.workActivity : 'sedentary';
  const workoutsPerWeek = Math.max(0, Math.min(10, Number(profileData.workoutsPerWeek) ?? 3));
  const goalKey = GOAL_TYPES[profileData.goalType] ? profileData.goalType : 'maintain';

  // 1. Mifflin-St Jeor BMR (Rustverbranding)
  const baseBmr = (10 * weight) + (6.25 * height) - (5 * age);
  const bmr = Math.round(gender === 'female' ? baseBmr - 161 : baseBmr + 5);

  // 2. Totale Dagelijkse Energiebehoefte (TDEE) = Werkfactor + Sporttoeslag
  const workFactor = WORK_ACTIVITY_LEVELS[workKey].factor;
  const workoutBonusMultiplier = workoutsPerWeek * 0.045; // ~4.5% extra BMR per wekelijkse sportsessie
  const totalMultiplier = workFactor + workoutBonusMultiplier;
  const tdee = Math.round(bmr * totalMultiplier);

  // 3. Dagelijks Caloriedoel op basis van gekozen doel
  const goalObj = GOAL_TYPES[goalKey];
  const minSafeCalories = gender === 'female' ? 1250 : 1500;
  const calorieGoal = Math.max(minSafeCalories, Math.round(tdee + goalObj.kcalDelta));

  // 4. Macro's berekenen op basis van lichaamsgewicht
  const proteinGoal = Math.round(weight * goalObj.proteinPerKg);
  const fatGoal = Math.max(40, Math.round(weight * goalObj.fatPerKg));
  const usedCalories = (proteinGoal * 4) + (fatGoal * 9);
  const remainingForCarbs = Math.max(200, calorieGoal - usedCalories);
  const carbsGoal = Math.round(remainingForCarbs / 4);

  // 5. Persoonlijke Waterbehoefte (35ml per kg + extra voor sport & actief werk)
  const baseWater = weight * 35;
  const workWaterBonus = (workKey === 'active' || workKey === 'very_active') ? 400 : (workKey === 'light' ? 200 : 0);
  const sportWaterBonus = Math.round((workoutsPerWeek * 450) / 7);
  const waterGoal = Math.round((baseWater + workWaterBonus + sportWaterBonus) / 50) * 50;

  return {
    bmr,
    tdee,
    calorieGoal,
    proteinGoal,
    carbsGoal,
    fatGoal,
    waterGoal
  };
}

// HULPFUNCTIES VOOR DATUMS EN TIJDSCHEMA
// ==========================================
function formatDateKey(dateObj) {
  const year = dateObj.getFullYear();
  const month = String(dateObj.getMonth() + 1).padStart(2, '0');
  const day = String(dateObj.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function getDutchDateLabel(dateKey) {
  const todayKey = formatDateKey(new Date());
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yesterdayKey = formatDateKey(yesterday);

  if (dateKey === todayKey) return "Vandaag";
  if (dateKey === yesterdayKey) return "Gisteren";

  const [y, m, d] = dateKey.split('-').map(Number);
  const dateObj = new Date(y, m - 1, d);
  return dateObj.toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' });
}

function timeToMinutes(timeStr) {
  if (!timeStr || !timeStr.includes(':')) return 420;
  const [h, m] = timeStr.split(':').map(Number);
  return h * 60 + m;
}

function minutesToTime(mins) {
  const normalized = ((mins % 1440) + 1440) % 1440;
  const h = Math.floor(normalized / 60);
  const m = normalized % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

// Genereert een slim dagschema op basis van opsta-tijd, slaaptijd en leefstijl

  const hasLunch = loggedMeals.some(m => m.mealType === "Lunch");

  const hasSnack = loggedMeals.some(m => m.mealType === "Tussendoortje");

  const schedule = [
    {
      id: "wake-water",

    },
    {
      id: "mid-morning-water",
      time: minutesToTime(wakeMins + 180),
      mins: wakeMins + 180,
      type: "water",
      title: "Voormiddag Drinkmoment",
      advice: "Neem een glas water of groene thee. Vaak voelt lichte uitdroging rond 10:30 uur als trek in zoetigheid.",
      completed: todayStats.water >= 750
    },
    {
      id: "lunch",
      time: minutesToTime(wakeMins + 315),
      mins: wakeMins + 315,
      type: "meal",
      mealCategory: "Lunch",
      title: "Energieke Lunch",
      advice: "Combineer langzame koolhydraten met magere eiwitten en groenten voor blijvende focus in de middag.",
      completed: hasLunch
    },
    {
      id: "afternoon-snack",
      time: minutesToTime(wakeMins + 510),
      mins: wakeMins + 510,
      type: "snack",
      mealCategory: "Tussendoortje",
      title: workoutMins ? "Pre-Workout / Middag Boost" : "Slimme 16:00u Snack",
      advice: workoutMins 
        ? "Je traint straks! Neem een lichte combinatie van fruit en eiwit voor optimale energie tijdens je training."
        : "Voorkom dat je om 17:30 uur uitgehongerd gaat koken. Neem een handje noten, kwark of een gekookt eitje.",
      completed: hasSnack
    },
    {
      id: "afternoon-water",
      time: minutesToTime(wakeMins + 570),
      mins: wakeMins + 570,
      type: "water",
      title: "Middag Hydratatie Check",
      advice: "Zorg dat je nu op minimaal 60% van je dagelijkse waterdoel zit.",
      completed: todayStats.water >= (profile.waterGoal * 0.6)
    },
    {
      id: "dinner",
      time: minutesToTime(workoutMins ? Math.max(wakeMins + 690, workoutMins + 75) : wakeMins + 690),
      mins: workoutMins ? Math.max(wakeMins + 690, workoutMins + 75) : wakeMins + 690,
      type: "meal",
      mealCategory: "Avondeten",
      title: "Herstellend Avondeten",
      advice: `Focus op verse groenten, ~${Math.round(profile.proteinGoal * 0.35)}g eiwit en een gebalanceerde portie koolhydraten.`,
      completed: hasDinner
    },
    {
      id: "evening-winddown",
      time: minutesToTime(sleepMins - 90),
      mins: sleepMins - 90,
      type: "rest",
      title: "Spijsverteringsrust & Ontspanning",
      advice: "Eet het liefst geen zware maaltijden meer vlak voor het slapen voor een diepere herstelslaap. Kopje kamillethee kan wel!",

    }
  ];

  return schedule.sort((a, b) => a.mins - b.mins);
}

    // Event kan al afgevuurd zijn voordat de app geladen was
    if (window.__installPrompt) setDeferredInstallPrompt(window.__installPrompt);
    const handleReady = () => setDeferredInstallPrompt(window.__installPrompt);
    const handleInstalled = () => { window.__installPrompt = null; setDeferredInstallPrompt(null); };
    window.addEventListener('installprompt-ready', handleReady);
    window.addEventListener('appinstalled', handleInstalled);
    return () => {
      window.removeEventListener('installprompt-ready', handleReady);
      window.removeEventListener('appinstalled', handleInstalled);
    };
  }, []);

  const handleInstallPwa = async () => {

      setShowInstallModal(true);

      appName: "NutriPulse AI Coach",
      exportedAt: new Date().toISOString(),
      profile,
      allMeals,
      dailyWaterMap,
      savedRecipes
    };

    a.download = `nutripulse-backup-${formatDateKey(new Date())}.json`;

    const rows = allMeals.map(m => [
      m.dateKey || "",
      m.time || "",

      `"${(m.mealName || "").replace(/"/g, '""')}"`,
      `"${(m.estimatedPortion || "").replace(/"/g, '""')}"`,
      m.calories || 0,
      m.protein || 0,
      m.carbs || 0,
      m.fat || 0
    ]);
    const csvContent = [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);

    a.download = `nutripulse-dagboek-${formatDateKey(new Date())}.csv`;

    URL.revokeObjectURL(url);
    showToast("Dagboek geëxporteerd naar Excel (.csv)! 📊");
  };

  // Importeer een eerder gedownloade JSON back-up
  const handleImportBackupJson = (event) => {
    const file = event.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (parsed.profile) setProfile(prev => ({ ...prev, ...parsed.profile }));
        if (Array.isArray(parsed.allMeals)) setAllMeals(parsed.allMeals);
        if (parsed.dailyWaterMap) setDailyWaterMap(parsed.dailyWaterMap);
        if (Array.isArray(parsed.savedRecipes)) setSavedRecipes(parsed.savedRecipes);
        showToast("Back-up succesvol ingeladen! ✨");
      } catch (err) {
        showToast("Ongeldig back-up bestand.", "error");
      }
    };
    reader.readAsText(file);
  };

  useEffect(() => {
    try { localStorage.setItem('nutripulse_profile_v2', JSON.stringify(profile)); } catch (e) {}

  useEffect(() => {
    try { localStorage.setItem('nutripulse_meals_v2', JSON.stringify(allMeals)); } catch (e) {}

  useEffect(() => {
    try { localStorage.setItem('nutripulse_water_v2', JSON.stringify(dailyWaterMap)); } catch (e) {}

  // 1. FIREBASE AUTHENTICATIE
  // ==========================================

      setAuthReady(true);

      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);

          await signInAnonymously(auth);

        console.warn("Authenticatie fallback naar lokale opslag:", err);
      }
    };
    initAuth();

    const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
      setUser(currentUser);
      setAuthReady(true);
    });
    return () => unsubscribe();

  // 2. FIRESTORE DATA LISTENERS

      mealsRef,
      (snapshot) => {
        const loaded = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        loaded.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        if (loaded.length > 0) setAllMeals(loaded);

      (err) => console.error("Maaltijden listener fout:", err)
    );

      waterRef,

      unsubMeals();
      unsubWater();
      unsubRecipes();

    if (user && db && !String(recipeId).startsWith('fav-')) {
      try {
        const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'savedRecipes', recipeId);
        await deleteDoc(docRef);
      } catch (err) {
        console.error("Fout bij recept verwijderen uit cloud:", err);
      }
    }
  };

  const requestNotificationPermission = async () => {
    if (typeof Notification === 'undefined') {
      showToast("Jouw browser ondersteunt geen systeemmeldingen, in-app meldingen staan wel aan!", "info");
      return;
    }
    try {
      const perm = await Notification.requestPermission();
      setBrowserNotifPermission(perm);
      if (perm === 'granted') {
        new Notification("NutriPulse Coach Actief! 🥗", {
          body: "Je ontvangt nu slimme herinneringen om op tijd te eten en water te drinken."
        });
        showToast("Meldingen succesvol geactiveerd!");
      }
    } catch (e) {
      showToast("In-app coach herinneringen zijn actief!", "info");
    }
  };

  // Datum wisselen
  const changeDateByDays = (offset) => {
    const [y, m, d] = selectedDate.split('-').map(Number);
    const current = new Date(y, m - 1, d);
    current.setDate(current.getDate() + offset);
    setSelectedDate(formatDateKey(current));
  };

  // ==========================================
  // AFGELEIDE DAGSTATISTIEKEN & SLIM SCHEMA
  // ==========================================
  const todayKey = formatDateKey(currentTime);

  const mealsForSelectedDate = useMemo(() => {
    return allMeals.filter(m => m.dateKey === selectedDate);
  }, [allMeals, selectedDate]);

  const selectedDateStats = useMemo(() => {
    return {
      calories: mealsForSelectedDate.reduce((sum, m) => sum + (Number(m.calories) || 0), 0),
      protein: mealsForSelectedDate.reduce((sum, m) => sum + (Number(m.protein) || 0), 0),
      carbs: mealsForSelectedDate.reduce((sum, m) => sum + (Number(m.carbs) || 0), 0),
      fat: mealsForSelectedDate.reduce((sum, m) => sum + (Number(m.fat) || 0), 0),
      water: Number(dailyWaterMap[selectedDate] || 0)
    };
  }, [mealsForSelectedDate, dailyWaterMap, selectedDate]);

  const todayMeals = useMemo(() => {
    return allMeals.filter(m => m.dateKey === todayKey);
  }, [allMeals, todayKey]);

  const todayStats = useMemo(() => {
    return {
      calories: todayMeals.reduce((sum, m) => sum + (Number(m.calories) || 0), 0),
      protein: todayMeals.reduce((sum, m) => sum + (Number(m.protein) || 0), 0),
      carbs: todayMeals.reduce((sum, m) => sum + (Number(m.carbs) || 0), 0),
      fat: todayMeals.reduce((sum, m) => sum + (Number(m.fat) || 0), 0),
      water: Number(dailyWaterMap[todayKey] || 0)
    };
  }, [todayMeals, dailyWaterMap, todayKey]);

  const smartSchedule = useMemo(() => {
    return generateSmartSchedule(profile, todayStats, todayMeals);
  }, [profile, todayStats, todayMeals]);

  const activeSmartPrompt = useMemo(() => {
    const nowMins = currentTime.getHours() * 60 + currentTime.getMinutes();
    const upcomingOrRecent = smartSchedule.find(
      item => !item.completed && Math.abs(nowMins - item.mins) <= 60
    );
    return upcomingOrRecent || smartSchedule.find(item => !item.completed) || null;
  }, [smartSchedule, currentTime]);

  return (
    <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans pb-24 selection:bg-emerald-500 selection:text-slate-950">
      {/* BOVENSTE HEADER */}
      <header className="sticky top-0 z-30 bg-slate-900/85 backdrop-blur-md border-b border-slate-800/80 px-4 py-3">
        <div className="max-w-4xl mx-auto flex items-center justify-between">
          <div className="flex items-center gap-2.5">
            <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/20">
              <Sparkles className="w-5 h-5 text-slate-950 stroke-[2.5]" />
            </div>
            <div>
              <h1 className="font-bold text-lg tracking-tight text-white leading-none flex items-center gap-2">

              <p className="text-xs text-slate-400 mt-0.5">Slimme Maaltijdscanner & Leefstijl Ritme</p>
            </div>
          </div>

          <div className="flex items-center gap-2">
            {/* DOWNLOAD / INSTALLEER APP KNOP */}
            <button
              onClick={handleInstallPwa}
              className="bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/30 text-emerald-300 text-xs font-semibold px-2.5 py-2 rounded-xl flex items-center gap-1.5 transition"
              title="Download of installeer op telefoon/PC & exporteer data"
            >
              <Download className="w-3.5 h-3.5 text-emerald-400" />
              <span className="hidden sm:inline">Download / App</span>
            </button>

            {/* DATUM SELECTOR */}
            <div className="flex items-center bg-slate-800/90 rounded-xl p-1 border border-slate-700/70">
              <button 
                onClick={() => changeDateByDays(-1)}
                className="p-1.5 hover:bg-slate-700 rounded-lg text-slate-300 transition"

              >
                <ChevronLeft className="w-4 h-4" />
              </button>
              <div className="px-2.5 flex items-center gap-1.5 text-xs sm:text-sm font-medium text-emerald-300">
                <Calendar className="w-3.5 h-3.5 text-emerald-400 hidden sm:inline" />
                <span>{getDutchDateLabel(selectedDate)}</span>
              </div>
              <button 
                onClick={() => changeDateByDays(1)}
                className="p-1.5 hover:bg-slate-700 rounded-lg text-slate-300 transition"
                title="Volgende dag"
              >
                <ChevronRight className="w-4 h-4" />
              </button>
            </div>
          </div>
        </div>
      </header>

      {/* MODAL VOOR APP INSTALLATIE & DATA DOWNLOADEN */}
      {showInstallModal && (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 space-y-5 shadow-2xl">
            <div className="flex items-start justify-between gap-4">
              <div className="flex items-center gap-2.5">
                <div className="p-2.5 rounded-2xl bg-emerald-500/15 text-emerald-400">
                  <Smartphone className="w-6 h-6" />
                </div>
                <div>
                  <h3 className="text-lg font-bold text-white">App Installeren & Downloads</h3>
                  <p className="text-xs text-slate-400">Zet NutriPulse op je startscherm of download je data</p>
                </div>
              </div>
              <button
                onClick={() => setShowInstallModal(false)}
                className="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl"
              >
                <X className="w-5 h-5" />
              </button>
            </div>

            {/* OPTIE 1: OP TELEFOON ZETTEN ALS WEBAPP */}
            <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4 space-y-3">
              <h4 className="text-sm font-bold text-emerald-400 flex items-center gap-2">
                <Smartphone className="w-4 h-4" /> 1. Gebruik als App op je Telefoon
              </h4>
              <p className="text-xs text-slate-300 leading-relaxed">
                Je kunt deze webapp direct als icoontje op het startscherm van je telefoon zetten. Hij opent dan schermvullend als een echte app:
              </p>
              <div className="space-y-2 text-xs text-slate-300">
                <div className="bg-slate-900 p-3 rounded-xl border border-slate-800">
                  <strong className="text-white">🍏 iPhone / iPad (Safari):</strong> Tik onderaan op het <strong>Deel-icoontje</strong> (vierkantje met pijltje omhoog) en kies <strong>"Zet op beginscherm"</strong>.
                </div>
                <div className="bg-slate-900 p-3 rounded-xl border border-slate-800">
                  <strong className="text-white">🤖 Android (Chrome):</strong> Tik rechtsboven op de <strong>3 puntjes (⋮)</strong> en kies <strong>"App installeren"</strong> of <strong>"Toevoegen aan startscherm"</strong>.
                </div>
              </div>
            </div>

            {/* OPTIE 2: DOWNLOAD JOUW DAGBOEK & GEGEVENS */}
            <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4 space-y-3">
              <h4 className="text-sm font-bold text-sky-400 flex items-center gap-2">
                <HardDriveDownload className="w-4 h-4" /> 2. Download jouw Dagboek & Back-up
              </h4>
              <p className="text-xs text-slate-400">
                Download al je gelogde maaltijden, je persoonlijke profiel en recepten naar je apparaat:
              </p>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <button
                  onClick={handleExportMealsCsv}
                  className="bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/30 text-emerald-300 font-semibold text-xs py-3 px-3 rounded-xl flex items-center justify-center gap-2 transition"
                >
                  <FileSpreadsheet className="w-4 h-4" /> Download Excel (.CSV)
                </button>
                <button
                  onClick={handleExportBackupJson}
                  className="bg-sky-500/15 hover:bg-sky-500/25 border border-sky-500/30 text-sky-300 font-semibold text-xs py-3 px-3 rounded-xl flex items-center justify-center gap-2 transition"
                >
                  <Download className="w-4 h-4" /> Volledige Back-up (.JSON)
                </button>
              </div>

              <div className="pt-2 border-t border-slate-800/80">
                <label className="w-full bg-slate-900 hover:bg-slate-800 border border-dashed border-slate-700 text-slate-300 font-medium text-xs py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 cursor-pointer transition">
                  <Upload className="w-4 h-4 text-emerald-400" /> Bestaande Back-up (.JSON) Inladen
                  <input
                    type="file"
                    accept=".json"
                    onChange={handleImportBackupJson}
                    className="hidden"
                  />
                </label>
              </div>
            </div>

            <button
              onClick={() => setShowInstallModal(false)}
              className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-2xl text-sm transition"
            >
              Sluiten
            </button>
          </div>
        </div>
      )}

      {/* SLIMME LIVE MELDING BANNER (Op basis van dagritme) */}
      {activeSmartPrompt && dismissedBannerId !== activeSmartPrompt.id && (
        <div className="bg-gradient-to-r from-emerald-950/90 via-teal-950/90 to-slate-900 border-b border-emerald-500/30 px-4 py-3">
          <div className="max-w-4xl mx-auto flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
            <div className="flex items-start gap-3">
              <div className={`p-2 rounded-xl mt-0.5 shrink-0 ${
                activeSmartPrompt.type === 'water' 
                  ? 'bg-sky-500/20 text-sky-400 border border-sky-500/30' 
                  : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'
              }`}>
                {activeSmartPrompt.type === 'water' ? <Droplets className="w-5 h-5" /> : <Bell className="w-5 h-5" />}
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[11px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300">
                    Slimme Herinnering • {activeSmartPrompt.time}
                  </span>
                  <h3 className="text-sm font-bold text-white">{activeSmartPrompt.title}</h3>
                </div>
                <p className="text-xs text-slate-300 mt-1 leading-relaxed">{activeSmartPrompt.advice}</p>
              </div>
            </div>

            <div className="flex items-center gap-2 self-end sm:self-center shrink-0">
              {activeSmartPrompt.type === 'water' ? (
                <button
                  onClick={() => handleAddWater(250, todayKey)}
                  className="px-3 py-1.5 rounded-lg bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold text-xs flex items-center gap-1.5 shadow-md transition"
                >
                  <Plus className="w-3.5 h-3.5 stroke-[2.5]" /> Drink 250 ml
                </button>
              ) : (
                <button
                  onClick={() => setActiveTab('log')}
                  className="px-3 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold text-xs flex items-center gap-1.5 shadow-md transition"
                >
                  <Camera className="w-3.5 h-3.5" /> Nu Loggen
                </button>
              )}
              <button
                onClick={() => setDismissedBannerId(activeSmartPrompt.id)}
                className="p-1.5 text-slate-400 hover:text-slate-200 rounded-lg"
                title="Verbergen"
              >
                <X className="w-4 h-4" />
              </button>
            </div>
          </div>
        </div>
      )}

      {/* TOAST MELDING */}
      {toastMessage && (
        <div className="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 max-w-md w-[92%] pointer-events-none">
          <div className={`px-4 py-3 rounded-2xl shadow-2xl border flex items-center gap-3 backdrop-blur-md ${
            toastMessage.type === 'error' 
              ? 'bg-rose-950/95 border-rose-500/50 text-rose-200' 
              : 'bg-emerald-950/95 border-emerald-500/50 text-emerald-100'
          }`}>
            <CheckCircle2 className="w-5 h-5 text-emerald-400 shrink-0" />
            <span className="text-sm font-medium">{toastMessage.text}</span>
          </div>
        </div>
      )}

      {/* HOOFDINHOUD */}
      <main className="flex-1 max-w-4xl w-full mx-auto px-4 py-6">
        {activeTab === 'dashboard' && (
          <DashboardView
            selectedDate={selectedDate}
            setSelectedDate={setSelectedDate}
            stats={selectedDateStats}
            profile={profile}
            meals={mealsForSelectedDate}
            onAddWater={(amount) => handleAddWater(amount, selectedDate)}
            onDeleteMeal={handleDeleteMeal}
            onNavigate={setActiveTab}
            smartSchedule={smartSchedule}
          />
        )}

        {activeTab === 'log' && (
          <LogMealView
            selectedDate={selectedDate}
            onSaveMeal={(meal) => {
              handleSaveMeal(meal, selectedDate);
              setActiveTab('dashboard');
            }}
            showToast={showToast}
          />
        )}

        {activeTab === 'coach' && (
          <LifestyleCoachView
            profile={profile}
            onSaveProfile={handleUpdateProfile}
            todayStats={todayStats}
            todayMeals={todayMeals}
            smartSchedule={smartSchedule}
            onAddWater={(amt) => handleAddWater(amt, todayKey)}
            onQuickLogMeal={(meal) => handleSaveMeal(meal, todayKey)}
            browserNotifPermission={browserNotifPermission}
            onRequestNotif={requestNotificationPermission}
            onNavigateProfile={() => setActiveTab('profile')}
            showToast={showToast}
          />
        )}

        {activeTab === 'profile' && (
          <PersonalProfileCalculatorView
            profile={profile}
            onSaveProfile={(updated) => {
              handleUpdateProfile(updated);
            }}
            onNavigateDashboard={() => setActiveTab('dashboard')}
            onOpenDownloadModal={() => setShowInstallModal(true)}
          />
        )}

        {activeTab === 'recipes' && (
          <RecipesView
            profile={profile}
            todayStats={todayStats}
            savedRecipes={savedRecipes}
            onLogRecipe={(recipe) => {
              handleSaveMeal({
                mealName: recipe.title,
                mealType: recipe.mealType || "Avondeten",
                calories: recipe.calories,
                protein: recipe.protein,
                carbs: recipe.carbs,
                fat: recipe.fat,
                estimatedPortion: "1 portie (Recept)",
                healthTip: recipe.shortDescription
              }, selectedDate);
            }}
            onSaveFavorite={handleSaveRecipeToFavorites}
            onDeleteFavorite={handleDeleteSavedRecipe}
            showToast={showToast}
          />
        )}
      </main>

      {/* ONDERSTE MOBIELE NAVIGATIEBALK (5 TABS INCL. PROFIEL & KCAL CALCULATOR) */}
      <nav className="fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 px-1.5 py-1.5">
        <div className="max-w-xl mx-auto grid grid-cols-5 gap-1">
          <button
            onClick={() => setActiveTab('dashboard')}
            className={`flex flex-col items-center justify-center py-2 rounded-xl transition ${
              activeTab === 'dashboard'
                ? 'text-emerald-400 bg-emerald-500/10 font-semibold'
                : 'text-slate-400 hover:text-slate-200'
            }`}
          >
            <Flame className="w-5 h-5 mb-0.5" />
            <span className="text-[10px] sm:text-[11px]">Dagboek</span>
          </button>

          <button
            onClick={() => setActiveTab('log')}
            className={`flex flex-col items-center justify-center py-2 rounded-xl transition ${
              activeTab === 'log'
                ? 'text-emerald-400 bg-emerald-500/10 font-semibold'
                : 'text-slate-400 hover:text-slate-200'
            }`}
          >
            <Camera className="w-5 h-5 mb-0.5" />
            <span className="text-[10px] sm:text-[11px]">Foto & Log</span>
          </button>

          <button
            onClick={() => setActiveTab('coach')}
            className={`flex flex-col items-center justify-center py-2 rounded-xl transition relative ${
              activeTab === 'coach'
                ? 'text-emerald-400 bg-emerald-500/10 font-semibold'
                : 'text-slate-400 hover:text-slate-200'
            }`}
          >
            <Clock className="w-5 h-5 mb-0.5" />
            <span className="text-[10px] sm:text-[11px]">Advies & Ritme</span>
            {activeSmartPrompt && (
              <span className="absolute top-1.5 right-4 w-2 h-2 rounded-full bg-emerald-400 animate-ping" />
            )}
          </button>

          <button
            onClick={() => setActiveTab('profile')}
            className={`flex flex-col items-center justify-center py-2 rounded-xl transition ${
              activeTab === 'profile'
                ? 'text-emerald-400 bg-emerald-500/10 font-semibold'
                : 'text-slate-400 hover:text-slate-200'
            }`}
          >
            <User className="w-5 h-5 mb-0.5" />
            <span className="text-[10px] sm:text-[11px]">Mijn Kcal</span>
          </button>

          <button
            onClick={() => setActiveTab('recipes')}
            className={`flex flex-col items-center justify-center py-2 rounded-xl transition ${
              activeTab === 'recipes'
                ? 'text-emerald-400 bg-emerald-500/10 font-semibold'
                : 'text-slate-400 hover:text-slate-200'
            }`}
          >
            <ChefHat className="w-5 h-5 mb-0.5" />
            <span className="text-[10px] sm:text-[11px]">Recepten</span>
          </button>
        </div>
      </nav>
    </div>
  );
}

// ==========================================
// TAB 1: DASHBOARD & DAGELIJKSE SAMENVATTING
// ==========================================
function DashboardView({ selectedDate, setSelectedDate, stats, profile, meals, onAddWater, onDeleteMeal, onNavigate, smartSchedule }) {
  const calPercent = Math.min(100, Math.round((stats.calories / (profile.calorieGoal || 2000)) * 100));
  const remainingCals = Math.max(0, (profile.calorieGoal || 2000) - stats.calories);

  const proteinPercent = Math.min(100, Math.round((stats.protein / (profile.proteinGoal || 140)) * 100));
  const carbsPercent = Math.min(100, Math.round((stats.carbs / (profile.carbsGoal || 220)) * 100));
  const fatPercent = Math.min(100, Math.round((stats.fat / (profile.fatGoal || 70)) * 100));
  const waterPercent = Math.min(100, Math.round((stats.water / (profile.waterGoal || 2500)) * 100));

  const mealCategories = ["Ontbijt", "Lunch", "Avondeten", "Tussendoortje"];

  return (
    <div className="space-y-6">
      {/* BOVENSTE SAMENVATTINGSKAART */}
      <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 sm:p-6 shadow-xl relative overflow-hidden">
        <div className="absolute -right-12 -top-12 w-44 h-44 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none" />
        
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-5 border-b border-slate-800">
          <div>
            <span className="text-xs font-semibold uppercase tracking-wider text-emerald-400">
              Samenvatting • {getDutchDateLabel(selectedDate)}
            </span>
            <h2 className="text-2xl font-bold text-white mt-0.5">Jouw Persoonlijke Balans</h2>
            <div className="flex flex-wrap items-center gap-2 mt-1.5">
              <span className="text-[11px] bg-slate-800 text-slate-300 px-2.5 py-0.5 rounded-full border border-slate-700">
                {profile.gender === 'female' ? 'Vrouw' : 'Man'} • {profile.age}j • {profile.weight}kg • {profile.height}cm
              </span>
              <span className="text-[11px] bg-emerald-500/10 text-emerald-300 px-2.5 py-0.5 rounded-full border border-emerald-500/20">
                {GOAL_TYPES[profile.goalType]?.label || 'Persoonlijk Doel'}
              </span>
              <button
                onClick={() => onNavigate('profile')}
                className="text-[11px] text-emerald-400 hover:underline font-semibold flex items-center gap-0.5"
              >
                Wijzig profiel <ArrowRight className="w-3 h-3" />
              </button>
            </div>
          </div>

          <div className="flex items-center gap-2">
            <input
              type="date"
              value={selectedDate}
              onChange={(e) => e.target.value && setSelectedDate(e.target.value)}
              className="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-xl px-3 py-2 focus:outline-none focus:border-emerald-500"
            />
            <button
              onClick={() => onNavigate('log')}
              className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs sm:text-sm px-4 py-2 rounded-xl flex items-center gap-1.5 shadow-lg shadow-emerald-500/20 transition"
            >
              <Camera className="w-4 h-4" /> Scan of Voeg Toe
            </button>
          </div>
        </div>

        {/* CALORIE RING & MACRO BARS */}
        <div className="grid grid-cols-1 md:grid-cols-12 gap-6 pt-5 items-center">
          {/* Calorie Cirkel */}
          <div className="md:col-span-5 flex items-center justify-center sm:justify-start gap-5 bg-slate-950/60 p-4 rounded-2xl border border-slate-800/80">
            <div className="relative w-28 h-28 flex items-center justify-center shrink-0">
              <svg className="w-full h-full -rotate-90" viewBox="0 0 100 100">
                <circle
                  cx="50"
                  cy="50"
                  r="42"
                  className="stroke-slate-800"
                  strokeWidth="10"
                  fill="transparent"
                />
                <circle
                  cx="50"
                  cy="50"
                  r="42"
                  className="stroke-emerald-400 transition-all duration-700 ease-out"
                  strokeWidth="10"
                  strokeDasharray={264}
                  strokeDashoffset={264 - (264 * calPercent) / 100}
                  strokeLinecap="round"
                  fill="transparent"
                />
              </svg>
              <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
                <span className="text-xl font-extrabold text-white">{stats.calories}</span>
                <span className="text-[10px] text-slate-400 uppercase">/ {profile.calorieGoal} kcal</span>
              </div>
            </div>

            <div className="space-y-1.5">
              <div className="text-xs text-slate-400">Resterend vandaag</div>
              <div className="text-2xl font-black text-emerald-400">{remainingCals} <span className="text-sm font-normal">kcal</span></div>
              <div className="text-xs text-slate-400 flex items-center gap-1">
                <Flame className="w-3.5 h-3.5 text-amber-400" /> {calPercent}% van je dagdoel
              </div>
            </div>

            <div className="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden my-4">

          <div className="flex items-center gap-2 pt-1">

            <button
              onClick={() => onAddWater(500)}

            >
              <Plus className="w-4 h-4" /> +Bidon (500ml)
            </button>
            {stats.water > 0 && (
              <button
                onClick={() => onAddWater(-250)}
                className="p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-400 rounded-xl text-xs transition"
                title="-250ml corrigeren"
              >
                -250
              </button>
            )}
          </div>
        </div>

        {/* Slimme Leefstijl & Eetmoment Widget */}
        <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 flex flex-col justify-between">
          <div className="flex items-start justify-between gap-3">
            <div className="flex items-center gap-2.5">
              <div className="p-2.5 rounded-xl bg-emerald-500/15 text-emerald-400">
                <Clock className="w-5 h-5" />
              </div>
              <div>
                <h3 className="font-bold text-white text-sm">Jouw Ritme & Eetmomenten</h3>

            </button>
          </div>

          <div className="my-3 space-y-2">
            {smartSchedule.slice(0, 3).map((item) => (
              <div key={item.id} className="flex items-center justify-between text-xs bg-slate-950/60 px-3 py-2 rounded-xl border border-slate-800/60">
                <div className="flex items-center gap-2">
                  <span className="font-mono font-bold text-emerald-400">{item.time}</span>
                  <span className="text-slate-200 font-medium">{item.title}</span>
                </div>
                {item.completed ? (
                  <span className="text-emerald-400 flex items-center gap-1 text-[11px]">
                    <Check className="w-3.5 h-3.5" /> Voltooid

                ) : (
                  <span className="text-slate-500 text-[11px]">Gepland</span>
                )}
              </div>
            ))}
          </div>

          <button
            onClick={() => onNavigate('coach')}
            className="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 transition"
          >
            <Sparkles className="w-4 h-4 text-emerald-400" /> Vraag AI Coach: Wat kan ik nu het beste eten?
          </button>
        </div>
      </div>

      {/* MAALTIJDEN VAN DE GESELECTEERDE DAG PER CATEGORIE */}
      <div className="space-y-4">
        <div className="flex items-center justify-between">
          <h3 className="text-lg font-bold text-white flex items-center gap-2">
            <Utensils className="w-5 h-5 text-emerald-400" />
            Maaltijdoverzicht ({meals.length} items)
          </h3>
          <button
            onClick={() => onNavigate('log')}
            className="text-xs font-semibold text-emerald-400 hover:text-emerald-300 flex items-center gap-1"
          >
            <Plus className="w-4 h-4" /> Maaltijd toevoegen
          </button>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          {mealCategories.map((category) => {
            const items = meals.filter(m => m.mealType === category);
            const categoryCals = items.reduce((sum, i) => sum + (Number(i.calories) || 0), 0);

            return (
              <div key={category} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
                    <div className="flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full bg-emerald-400" />
                      <h4 className="font-bold text-white text-sm">{category}</h4>
                    </div>
                    <span className="text-xs font-semibold text-slate-400">{categoryCals} kcal</span>
                  </div>

                  {items.length === 0 ? (
                    <div className="py-6 text-center">
                      <p className="text-xs text-slate-500">Nog niets gelogd voor {category.toLowerCase()}</p>

                  ) : (
                    <div className="space-y-2.5">
                      {items.map((item) => (
                        <div key={item.id} className="bg-slate-950/70 border border-slate-800/80 rounded-xl p-3 flex items-start justify-between gap-2">
                          <div className="space-y-1">
                            <div className="flex items-center gap-2">
                              <span className="text-[11px] font-mono text-slate-400">{item.time}</span>
                              <h5 className="text-sm font-semibold text-white">{item.mealName}</h5>
                            </div>
                            <p className="text-[11px] text-slate-400">{item.estimatedPortion}</p>
                            <div className="flex flex-wrap items-center gap-2 pt-1 text-[11px]">
                              <span className="px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-300 font-semibold">
                                {item.calories} kcal
                              </span>
                              <span className="text-rose-300">E: {item.protein}g</span>
                              <span className="text-amber-300">K: {item.carbs}g</span>
                              <span className="text-violet-300">V: {item.fat}g</span>
                            </div>
                            {item.healthTip && (
                              <p className="text-[11px] text-emerald-400/90 italic pt-1">
                                💡 {item.healthTip}
                              </p>
                            )}
                          </div>
                          <button
                            onClick={() => onDeleteMeal(item.id)}
                            className="p-1.5 text-slate-500 hover:text-rose-400 rounded-lg transition shrink-0"
                            title="Verwijder item"
                          >
                            <Trash2 className="w-4 h-4" />
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <button
                  onClick={() => onNavigate('log')}
                  className="mt-3 w-full py-2 rounded-xl border border-dashed border-slate-700 hover:border-emerald-500/50 text-xs text-slate-400 hover:text-emerald-300 flex items-center justify-center gap-1 transition"
                >
                  <Plus className="w-3.5 h-3.5" /> {category} toevoegen
                </button>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ==========================================
// TAB 2: AI FOTO SCANNER & HANDMATIG LOGGEN
// ==========================================
function LogMealView({ selectedDate, onSaveMeal, showToast }) {
  const [mode, setMode] = useState('photo'); // 'photo' | 'ai-text' | 'manual'
  
  // Foto Scanner State
  const [imagePreview, setImagePreview] = useState(null);
  const [imageBase64, setImageBase64] = useState(null);
  const [imageMimeType, setImageMimeType] = useState("image/jpeg");
  const [photoNote, setPhotoNote] = useState("");
  const [isAnalyzing, setIsAnalyzing] = useState(false);
  const [analysisResult, setAnalysisResult] = useState(null);
  const fileInputRef = useRef(null);

  // AI Tekst State
  const [textQuery, setTextQuery] = useState("");

  // Handmatig Formulier State (ook gebruikt om AI resultaat bij te stellen voor opslaan)
  const [formState, setFormState] = useState({
    mealName: "",
    mealType: "Lunch",
    estimatedPortion: "1 portie",
    calories: "",
    protein: "",
    carbs: "",
    fat: "",
    healthTip: ""
  });

  // Verwerk gekozen of gemaakte foto
  const handleFileChange = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      const dataUrl = event.target.result;
      setImagePreview(dataUrl);
      const [header, base64] = dataUrl.split(',');
      const mimeMatch = header.match(/data:(.*);base64/);
      setImageMimeType(mimeMatch ? mimeMatch[1] : file.type || "image/jpeg");
      setImageBase64(base64);
      setAnalysisResult(null);
    };
    reader.readAsDataURL(file);
  };

  const handleRunPhotoAnalysis = async () => {
    if (!imageBase64) return;
    setIsAnalyzing(true);
    try {
      const result = await analyzeMealImageWithGemini(imageBase64, imageMimeType, photoNote);
      setAnalysisResult(result);
      setFormState({
        mealName: result.mealName || "Gescande Maaltijd",
        mealType: ["Ontbijt", "Lunch", "Avondeten", "Tussendoortje"].includes(result.suggestedMealType) 
          ? result.suggestedMealType 
          : "Lunch",
        estimatedPortion: result.estimatedPortion || "1 bord",
        calories: result.calories || 0,
        protein: result.protein || 0,
        carbs: result.carbs || 0,
        fat: result.fat || 0,
        healthTip: result.healthTip || ""
      });
      showToast("Foto succesvol geanalyseerd door AI! ✨");
    } catch (err) {
      console.error(err);
      showToast(aiErrorMessage(err, "Kon de foto niet analyseren. Probeer het opnieuw of vul handmatig in."), "error");
    } finally {
      setIsAnalyzing(false);
    }
  };

  const handleRunTextAnalysis = async () => {
    if (!textQuery.trim()) return;
    setIsAnalyzing(true);
    try {
      const result = await analyzeMealTextWithGemini(textQuery);
      setAnalysisResult(result);
      setFormState({
        mealName: result.mealName || textQuery,
        mealType: ["Ontbijt", "Lunch", "Avondeten", "Tussendoortje"].includes(result.suggestedMealType) 
          ? result.suggestedMealType 
          : "Lunch",
        estimatedPortion: result.estimatedPortion || "1 portie",
        calories: result.calories || 0,
        protein: result.protein || 0,
        carbs: result.carbs || 0,
        fat: result.fat || 0,
        healthTip: result.healthTip || ""
      });
      showToast("Voedingswaarde berekend!");
    } catch (err) {
      console.error(err);
      showToast(aiErrorMessage(err, "Kon tekst niet berekenen. Probeer het nog eens."), "error");
    } finally {
      setIsAnalyzing(false);
    }
  };

  const handleSubmitForm = (e) => {
    e.preventDefault();
    if (!formState.mealName) {
      showToast("Vul een naam in voor de maaltijd.", "error");
      return;
    }
    onSaveMeal(formState);
  };

  return (
    <div className="space-y-6">
      {/* KEUZE TABS: FOTO SCANNER / AI TEKST / HANDMATIG */}
      <div className="bg-slate-900 border border-slate-800 p-1.5 rounded-2xl grid grid-cols-3 gap-1.5">
        <button
          onClick={() => setMode('photo')}
          className={`py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold flex items-center justify-center gap-2 transition ${
            mode === 'photo'
              ? 'bg-emerald-500 text-slate-950 shadow-md'
              : 'text-slate-300 hover:bg-slate-800'
          }`}
        >
          <Camera className="w-4 h-4" /> AI Foto Scanner
        </button>
        <button
          onClick={() => setMode('ai-text')}
          className={`py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold flex items-center justify-center gap-2 transition ${
            mode === 'ai-text'
              ? 'bg-emerald-500 text-slate-950 shadow-md'
              : 'text-slate-300 hover:bg-slate-800'
          }`}
        >
          <Sparkles className="w-4 h-4" /> Typ & Bereken
        </button>
        <button
          onClick={() => setMode('manual')}
          className={`py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold flex items-center justify-center gap-2 transition ${
            mode === 'manual'
              ? 'bg-emerald-500 text-slate-950 shadow-md'
              : 'text-slate-300 hover:bg-slate-800'
          }`}
        >
          <Edit3 className="w-4 h-4" /> Handmatig
        </button>
      </div>

      {(mode === 'photo' || mode === 'ai-text') && <ApiKeyBox />}

      {/* MODUS 1: AI FOTO SCANNER */}
      {mode === 'photo' && (
        <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 sm:p-6 space-y-5">
          <div>
            <h2 className="text-xl font-bold text-white flex items-center gap-2">
              <Camera className="w-5 h-5 text-emerald-400" /> Maak een foto van je bord
            </h2>
            <p className="text-xs sm:text-sm text-slate-400 mt-1">
              Onze AI herkent de ingrediënten op je foto en schat direct de calorieën, eiwitten, koolhydraten en vetten in.
            </p>
          </div>

          <input
            ref={fileInputRef}
            type="file"
            accept="image/*"
            capture="environment"
            onChange={handleFileChange}
            className="hidden"
          />

          {!imagePreview ? (
            <div 
              onClick={() => fileInputRef.current?.click()}
              className="border-2 border-dashed border-emerald-500/40 hover:border-emerald-400 bg-slate-950/60 hover:bg-slate-950 rounded-3xl p-8 text-center cursor-pointer transition group"
            >
              <div className="w-16 h-16 rounded-2xl bg-emerald-500/15 text-emerald-400 flex items-center justify-center mx-auto mb-4 group-hover:scale-105 transition">
                <Camera className="w-8 h-8" />
              </div>
              <h3 className="font-bold text-white text-base">Tik om een foto te maken of te uploaden</h3>
              <p className="text-xs text-slate-400 mt-1 max-w-sm mx-auto">
                Werkt direct met je telefooncamera of kies een maaltijdfoto uit je galerij.
              </p>
            </div>
          ) : (
            <div className="space-y-4">
              <div className="relative rounded-2xl overflow-hidden border border-slate-700 max-h-72 bg-slate-950 flex items-center justify-center">
                <img src={imagePreview} alt="Maaltijd preview" className="max-h-72 w-auto object-contain" />
                <button
                  onClick={() => {
                    setImagePreview(null);
                    setImageBase64(null);
                    setAnalysisResult(null);
                  }}
                  className="absolute top-3 right-3 bg-slate-900/90 hover:bg-rose-600 text-white p-2 rounded-xl text-xs flex items-center gap-1 shadow-lg transition"
                >
                  <X className="w-4 h-4" /> Andere foto
                </button>
              </div>

              <div>
                <label className="block text-xs font-medium text-slate-300 mb-1">
                  Optionele toelichting (bijv. "gebakken in olijfolie" of "volkoren pasta"):
                </label>
                <input
                  type="text"
                  value={photoNote}
                  onChange={(e) => setPhotoNote(e.target.value)}
                  placeholder="Typ eventuele extra details..."
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"
                />
              </div>

              <button
                onClick={handleRunPhotoAnalysis}
                disabled={isAnalyzing}
                className="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 disabled:opacity-50 text-slate-950 font-bold py-3.5 px-6 rounded-2xl flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20 transition"
              >
                {isAnalyzing ? (
                  <>
                    <RefreshCw className="w-5 h-5 animate-spin" /> AI analyseert je maaltijd...
                  </>
                ) : (
                  <>
                    <Sparkles className="w-5 h-5" /> Analyseer Calorieën & Macro's
                  </>
                )}
              </button>
            </div>
          )}
        </div>
      )}

      {/* MODUS 2: AI TEKST ZOEKEN */}
      {mode === 'ai-text' && (
        <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 sm:p-6 space-y-4">
          <div>
            <h2 className="text-xl font-bold text-white flex items-center gap-2">
              <Sparkles className="w-5 h-5 text-emerald-400" /> Vertel wat je hebt gegeten
            </h2>
            <p className="text-xs sm:text-sm text-slate-400 mt-1">
              Omschrijf je maaltijd in gewone taal en laat de AI alle voedingswaarden voor je opzoeken.
            </p>
          </div>

          <textarea
            rows={3}
            value={textQuery}
            onChange={(e) => setTextQuery(e.target.value)}
            placeholder="Bijv: 2 volkoren boterhammen met 100% pindakaas, een banaan en een cappuccino met havermelk..."
            className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-sm text-white focus:outline-none focus:border-emerald-500"
          />

          <div className="flex flex-wrap gap-2">
            {[
              "2 gekookte eieren op volkoren brood",
              "Schaaltje magere kwark (250g) met handje walnoten",
              "Portie kip kerrie met rijst en broccoli"
            ].map((sample) => (
              <button
                key={sample}
                onClick={() => setTextQuery(sample)}
                className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl transition"
              >
                + "{sample}"
              </button>
            ))}
          </div>

          <button
            onClick={handleRunTextAnalysis}
            disabled={isAnalyzing || !textQuery.trim()}
            className="w-full bg-emerald-500 hover:bg-emerald-400 disabled:opacity-50 text-slate-950 font-bold py-3.5 px-6 rounded-2xl flex items-center justify-center gap-2 shadow-lg transition"
          >
            {isAnalyzing ? (
              <>
                <RefreshCw className="w-5 h-5 animate-spin" /> Voedingswaarden berekenen...
              </>
            ) : (
              <>
                <Sparkles className="w-5 h-5" /> Bereken Voedingswaarde
              </>
            )}
          </button>
        </div>
      )}

      {/* AI GEDETECTEERDE INGREDIENTEN OVERZICHT */}
      {analysisResult && (mode === 'photo' || mode === 'ai-text') && (
        <div className="bg-emerald-950/30 border border-emerald-500/40 rounded-3xl p-5 space-y-3">
          <div className="flex items-center justify-between">
            <span className="text-xs font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-1.5">
              <CheckCircle2 className="w-4 h-4" /> AI Analyse Resultaat
            </span>
            <span className="text-xs text-slate-400">{analysisResult.estimatedPortion}</span>
          </div>
          <h3 className="text-lg font-bold text-white">{analysisResult.mealName}</h3>
          
          {analysisResult.detectedItems?.length > 0 && (
            <div className="flex flex-wrap gap-1.5">
              {analysisResult.detectedItems.map((item, idx) => (
                <span key={idx} className="text-xs bg-slate-900/90 border border-slate-700 text-slate-200 px-2.5 py-1 rounded-lg">
                  • {item}
                </span>
              ))}
            </div>
          )}

          {analysisResult.healthTip && (
            <p className="text-xs text-emerald-300 bg-emerald-500/10 p-3 rounded-xl border border-emerald-500/20">
              💡 <strong>Coach Tip:</strong> {analysisResult.healthTip}
            </p>
          )}
        </div>
      )}

      {/* BEWERK & OPSLAAN FORMULIER (Altijd zichtbaar in 'manual' of na een AI-analyse) */}
      {(mode === 'manual' || analysisResult) && (

// TAB 3: LEEFSTIJL COACH, DAGRITME & MELDINGEN
// ==========================================
function LifestyleCoachView({
  profile,
  onSaveProfile,
  todayStats,
  todayMeals,
  smartSchedule,
  onAddWater,
  onQuickLogMeal,
  browserNotifPermission,
  onRequestNotif,
  onNavigateProfile,
  showToast
}) {
  const [editProfile, setEditProfile] = useState(profile);
  const [showSettings, setShowSettings] = useState(false);
  const [aiAdvice, setAiAdvice] = useState(null);
  const [loadingAdvice, setLoadingAdvice] = useState(false);

  useEffect(() => {
    setEditProfile(profile);
  }, [profile]);

  const handleAskLiveCoach = async () => {
    setLoadingAdvice(true);
    try {
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const result = await getLiveCoachAdvice(profile, todayStats, todayMeals, timeStr);
      setAiAdvice(result);
    } catch (err) {
      console.error(err);
      showToast(aiErrorMessage(err, "Kon AI Coach advies even niet ophalen.").replace(" (bovenaan dit scherm)", " (via Maaltijd toevoegen → Typ & Bereken)"), "error");
    } finally {
      setLoadingAdvice(false);
    }
  };

  const handleSaveSettings = (e) => {
    e.preventDefault();
    onSaveProfile({
      ...profile,
      wakeTime: editProfile.wakeTime,
      sleepTime: editProfile.sleepTime,
      lifestyleType: editProfile.lifestyleType,
      workoutTime: editProfile.workoutTime
    });
    setShowSettings(false);
  };

  return (
    <div className="space-y-6">
      {/* LIVE AI COACH ADVIES KAART */}
      <div className="bg-gradient-to-br from-emerald-950/80 via-slate-900 to-slate-900 border border-emerald-500/30 rounded-3xl p-5 sm:p-6 shadow-xl">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div className="space-y-1">
            <span className="text-xs font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-1.5">
              <Sparkles className="w-4 h-4" /> Persoonlijke AI Leefstijl Coach
            </span>
            <h2 className="text-xl sm:text-2xl font-bold text-white">
              Wat en wanneer kan ik nu het beste eten?
            </h2>
            <p className="text-xs sm:text-sm text-slate-300">
              Afgestemd op jouw profiel ({profile.gender === 'female' ? 'Vrouw' : 'Man'}, {profile.age}j, {profile.weight}kg), jouw werk ({WORK_ACTIVITY_LEVELS[profile.workActivity]?.label || profile.lifestyleType}) en je resterende macro's.
            </p>
          </div>

          <button
            onClick={handleAskLiveCoach}
            disabled={loadingAdvice}
            className="bg-emerald-500 hover:bg-emerald-400 disabled:opacity-50 text-slate-950 font-bold text-xs sm:text-sm px-5 py-3 rounded-2xl flex items-center justify-center gap-2 shrink-0 shadow-lg shadow-emerald-500/20 transition"
          >
            {loadingAdvice ? (
              <>
                <RefreshCw className="w-4 h-4 animate-spin" /> Coach denkt na...
              </>
            ) : (
              <>
                <Sparkles className="w-4 h-4" /> Geef Mij Nu Advies
              </>
            )}
          </button>
        </div>

        {/* AI ADVIES RESULTAAT */}
        {aiAdvice && (
          <div className="mt-5 pt-5 border-t border-emerald-500/20 space-y-4">
            <div className="bg-slate-950/80 border border-emerald-500/30 rounded-2xl p-4 space-y-2">
              <h3 className="font-bold text-emerald-300 text-base">{aiAdvice.headline}</h3>
              <p className="text-sm text-slate-200 leading-relaxed">{aiAdvice.rightNowAction}</p>
              <div className="flex flex-wrap items-center gap-3 pt-2 text-xs text-slate-300">
                <span className="bg-emerald-500/15 text-emerald-300 px-3 py-1 rounded-lg font-medium flex items-center gap-1.5">
                  <Clock className="w-3.5 h-3.5" /> {aiAdvice.nextMealTiming}
                </span>
                <span className="bg-sky-500/15 text-sky-300 px-3 py-1 rounded-lg font-medium flex items-center gap-1.5">
                  <Droplets className="w-3.5 h-3.5" /> {aiAdvice.hydrationAdvice}
                </span>
              </div>
            </div>

            {aiAdvice.concreteSuggestions?.length > 0 && (
              <div>
                <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2.5">
                  Aanbevolen voor dit moment (1-klik toevoegen):
                </h4>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  {aiAdvice.concreteSuggestions.map((sug, idx) => (
                    <div key={idx} className="bg-slate-950/70 border border-slate-800 rounded-2xl p-3.5 flex flex-col justify-between">
                      <div>
                        <h5 className="font-bold text-white text-sm">{sug.title}</h5>
                        <p className="text-xs text-slate-400 mt-1">{sug.why}</p>
                      </div>
                      <div className="mt-3 pt-2.5 border-t border-slate-800/80 flex items-center justify-between">

                          <span className="text-emerald-400 font-bold">{sug.calories} kcal</span>
                          <span className="text-slate-400"> • {sug.protein}g E</span>

                            mealName: sug.title,

                            carbs: Math.round((sug.calories - sug.protein * 4) / 8),

              <Bell className="w-5 h-5 text-emerald-400" />
              Slim Tijdschema & Eet/Drink Meldingen
            </h3>
            <p className="text-xs text-slate-400 mt-0.5">
              Jouw schema berekent automatisch wanneer je lichaam water, brandstof of eiwitten nodig heeft.

          <div className="flex flex-wrap items-center gap-2">
            {browserNotifPermission !== 'granted' && (
              <button
                onClick={onRequestNotif}
                className="bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-emerald-500/30 text-xs font-semibold px-3 py-2 rounded-xl flex items-center gap-1.5 transition"

                <Bell className="w-3.5 h-3.5" /> Meldingen Activeren
              </button>

            <button
              onClick={() => setShowSettings(!showSettings)}
              className="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-3.5 py-2 rounded-xl flex items-center gap-1.5 transition"
            >
              <Clock className="w-3.5 h-3.5 text-emerald-400" /> {showSettings ? "Sluit Tijden" : "Wijzig Tijden"}
            </button>
            <button
              onClick={onNavigateProfile}
              className="bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-300 text-xs font-semibold px-3.5 py-2 rounded-xl flex items-center gap-1.5 transition"
            >
              <User className="w-3.5 h-3.5" /> Mijn Kcal & Profiel
            </button>
          </div>
        </div>

        {/* UITKLAPBAAR FORMULIER VOOR SLAAP & SPORTTIJDEN */}
        {showSettings && (
          <form onSubmit={handleSaveSettings} className="my-5 bg-slate-950 border border-slate-800 rounded-2xl p-4 sm:p-5 space-y-4">
            <h4 className="font-bold text-white text-sm">Pas jouw dagelijkse tijden aan</h4>
            
            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
              <div>
                <label className="block text-xs text-slate-400 mb-1">Hoe laat sta je op?</label>
                <input
                  type="time"
                  value={editProfile.wakeTime}
                  onChange={(e) => setEditProfile({ ...editProfile, wakeTime: e.target.value })}
                  className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white"
                />
              </div>

              <div>
                <label className="block text-xs text-slate-400 mb-1">Hoe laat ga je slapen?</label>
                <input
                  type="time"
                  value={editProfile.sleepTime}
                  onChange={(e) => setEditProfile({ ...editProfile, sleepTime: e.target.value })}
                  className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white"
                />
              </div>

              <div>
                <label className="block text-xs text-slate-400 mb-1">Type dagindeling</label>
                <select
                  value={editProfile.lifestyleType}
                  onChange={(e) => setEditProfile({ ...editProfile, lifestyleType: e.target.value })}
                  className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white"
                >
                  <option value="Kantoorbaan + Avondsport">Kantoorbaan + Avondsport</option>
                  <option value="Thuiswerk / Rustige dag">Thuiswerk / Rustige dag</option>
                  <option value="Fysiek werk / Veel onderweg">Fysiek werk / Veel onderweg</option>
                  <option value="Ochtendsporter">Ochtendsporter</option>
                  <option value="Onregelmatige diensten">Onregelmatige diensten</option>

              <div>
                <label className="block text-xs text-slate-400 mb-1">Sporttijd vandaag (optioneel)</label>
                <input
                  type="time"
                  value={editProfile.workoutTime}
                  onChange={(e) => setEditProfile({ ...editProfile, workoutTime: e.target.value })}
                  className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white"
                />

            </div>

            <button
              type="submit"
              className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2.5 rounded-xl text-sm transition"
            >
              Dagritme Opslaan
            </button>

        )}

        {/* TIJDLIJN VAN DE DAG */}
        <div className="mt-5 space-y-3">
          {smartSchedule.map((item) => (
            <div
              key={item.id}
              className={`p-4 rounded-2xl border transition flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${
                item.completed

              }`}
            >
              <div className="flex items-start gap-3.5">
                <div className={`px-2.5 py-1.5 rounded-xl font-mono text-xs font-bold shrink-0 ${
                  item.completed
                    ? 'bg-emerald-500/15 text-emerald-400'

                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h4 className="font-bold text-white text-sm">{item.title}</h4>
                    {item.completed && (
                      <span className="text-[11px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full font-semibold flex items-center gap-1">

// ==========================================
// NIEUW TABBLAD: PERSOONLIJKE BMR, TDEE & MACRO CALCULATOR
// ==========================================
function PersonalProfileCalculatorView({ profile, onSaveProfile, onNavigateDashboard, onOpenDownloadModal }) {
  const [form, setForm] = useState(() => ({
    ...DEFAULT_PROFILE,
    ...profile
  }));

  // Bereken altijd live de wetenschappelijke waarden op basis van de ingevulde lichaamsgegevens
  const calculated = useMemo(() => {
    return calculatePersonalNutrition(form);
  }, [form.gender, form.age, form.weight, form.height, form.workActivity, form.workoutsPerWeek, form.goalType]);

  // Als 'autoCalculate' aan staat, neem de berekende waarden direct over wanneer bio-inputs veranderen
  const handleBioChange = (field, value) => {
    const updated = { ...form, [field]: value };
    if (updated.autoCalculate) {
      const recalc = calculatePersonalNutrition(updated);
      setForm({
        ...updated,
        ...recalc
      });
    } else {
      setForm(updated);
    }
  };

  const handleToggleAutoCalculate = (enabled) => {
    if (enabled) {
      const recalc = calculatePersonalNutrition(form);
      setForm({
        ...form,
        autoCalculate: true,
        ...recalc
      });
    } else {
      setForm({
        ...form,
        autoCalculate: false
      });
    }
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    const finalStats = form.autoCalculate ? calculated : {
      bmr: calculated.bmr,
      tdee: calculated.tdee,
      calorieGoal: Number(form.calorieGoal) || calculated.calorieGoal,
      proteinGoal: Number(form.proteinGoal) || calculated.proteinGoal,
      carbsGoal: Number(form.carbsGoal) || calculated.carbsGoal,
      fatGoal: Number(form.fatGoal) || calculated.fatGoal,
      waterGoal: Number(form.waterGoal) || calculated.waterGoal
    };

    const workLabel = WORK_ACTIVITY_LEVELS[form.workActivity]?.label || "Kantoorbaan";
    const sportSuffix = Number(form.workoutsPerWeek) > 0 ? `${form.workoutsPerWeek}x p/w Sport` : "Geen sport";

    onSaveProfile({
      ...form,
      ...finalStats,
      lifestyleType: `${workLabel.split('/')[0].trim()} + ${sportSuffix}`
    });
    onNavigateDashboard();
  };

  return (
    <form onSubmit={handleSubmit} className="space-y-6">
      {/* HEADER KAART */}
      <div className="bg-gradient-to-br from-emerald-950/90 via-slate-900 to-slate-900 border border-emerald-500/30 rounded-3xl p-5 sm:p-6 shadow-xl">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div>
            <span className="text-xs font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-1.5">
              <Activity className="w-4 h-4" /> Persoonlijke Voeding & Verbranding Calculator
            </span>
            <h2 className="text-xl sm:text-2xl font-bold text-white mt-1">
              Calorieën & Macro's op maat voor jouw lichaam
            </h2>
            <p className="text-xs sm:text-sm text-slate-300 mt-1">
              Berekend met de wetenschappelijke <strong>Mifflin-St Jeor formule</strong> op basis van jouw geslacht, leeftijd, gewicht, lengte, type werk en sport.
            </p>
          </div>
        </div>

        {/* WETENSCHAPPELIJKE VERBRANDING BREAKDOWN (BMR -> TDEE -> DOEL) */}
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-5">
          <div className="bg-slate-950/80 border border-slate-800 rounded-2xl p-4">
            <div className="text-xs text-slate-400 font-medium">1. Jouw Rustverbranding (BMR)</div>
            <div className="text-2xl font-extrabold text-white mt-1">
              {calculated.bmr} <span className="text-xs font-normal text-slate-400">kcal / dag</span>
            </div>
            <p className="text-[11px] text-slate-400 mt-1">
              Wat je lichaam puur in rust verbrandt op basis van {form.weight}kg & {form.height}cm.
            </p>
          </div>

          <div className="bg-slate-950/80 border border-slate-800 rounded-2xl p-4">
            <div className="text-xs text-amber-300 font-medium">2. Verbranding Werk & Sport (TDEE)</div>
            <div className="text-2xl font-extrabold text-amber-400 mt-1">
              {calculated.tdee} <span className="text-xs font-normal text-slate-400">kcal / dag</span>
            </div>
            <p className="text-[11px] text-slate-400 mt-1">
              Totale verbranding inclusief jouw dagelijkse werk en {form.workoutsPerWeek}x sporten p/w.
            </p>
          </div>

          <div className="bg-emerald-950/60 border border-emerald-500/40 rounded-2xl p-4">
            <div className="text-xs text-emerald-300 font-bold">3. Jouw Dagelijkse Doel</div>
            <div className="text-2xl font-black text-emerald-400 mt-1">
              {form.autoCalculate ? calculated.calorieGoal : form.calorieGoal}{' '}
              <span className="text-xs font-normal text-emerald-200">kcal / dag</span>
            </div>
            <p className="text-[11px] text-emerald-200/80 mt-1">
              Afgestemd op: {GOAL_TYPES[form.goalType]?.label}
            </p>
          </div>
        </div>
      </div>

      {/* STAP 1: LICHAAMSGEGEVENS (GESLACHT, LEEFTIJD, GEWICHT, LENGTE) */}
      <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 sm:p-6 space-y-5">
        <h3 className="text-base font-bold text-white flex items-center gap-2">
          <User className="w-5 h-5 text-emerald-400" />
          1. Jouw Persoonlijke Gegevens
        </h3>

                form.gender === 'male'
                  ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300 shadow-lg shadow-emerald-500/10'
                  : 'bg-slate-950 border-slate-800 text-slate-400 hover:text-slate-200'
              }`}
            >
              <span>👨</span> Man
            </button>
            <button
              type="button"
              onClick={() => handleBioChange('gender', 'female')}

          <div className="bg-slate-950 border border-slate-800 rounded-2xl p-3.5">

            <input
              type="number"
              min={120}
              max={230}
              value={form.height}
              onChange={(e) => handleBioChange('height', e.target.value)}

            />
          </div>
        </div>
      </div>

      {/* STAP 2: WERK, DAGELIJKSE ACTIVITEIT & SPORT */}
      <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 sm:p-6 space-y-5">
        <h3 className="text-base font-bold text-white flex items-center gap-2">
          <Dumbbell className="w-5 h-5 text-emerald-400" />

        <div>
          <label className="block text-xs text-slate-400 mb-2">Wat voor werk / dagelijkse beweging heb je?</label>

            {Object.entries(WORK_ACTIVITY_LEVELS).map(([key, item]) => (
              <button
                type="button"
                key={key}
                onClick={() => handleBioChange('workActivity', key)}
                className={`p-3.5 rounded-2xl border text-left transition ${
                  form.workActivity === key
                    ? 'bg-emerald-500/15 border-emerald-500 text-white'
                    : 'bg-slate-950 border-slate-800 text-slate-300 hover:border-slate-700'

              >
                <div className="font-bold text-xs sm:text-sm flex items-center justify-between">
                  <span>{item.label}</span>
                  {form.workActivity === key && <CheckCircle2 className="w-4 h-4 text-emerald-400 shrink-0" />}
                </div>
                <p className="text-[11px] text-slate-400 mt-1 leading-snug">{item.desc}</p>
              </button>
