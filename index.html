        </div>

        {/* Sportfrequentie per week */}
        <div>
          <div className="flex items-center justify-between text-xs mb-2">
            <span className="text-slate-400">Hoe vaak sport of train je gemiddeld per week?</span>
            <span className="font-bold text-emerald-400">{form.workoutsPerWeek}x per week</span>
          </div>
          <div className="grid grid-cols-7 gap-1.5">
            {[0, 1, 2, 3, 4, 5, 6].map((num) => (
              <button
                type="button"
                key={num}
                onClick={() => handleBioChange('workoutsPerWeek', num)}
                className={`py-2.5 rounded-xl font-bold text-xs border transition ${
                  Number(form.workoutsPerWeek) === num
                    ? 'bg-emerald-500 text-slate-950 border-emerald-400'
                    : 'bg-slate-950 text-slate-300 border-slate-800 hover:bg-slate-800'
                }`}
              >
                {num === 6 ? '6+' : `${num}x`}
              </button>
            ))}
          </div>
        </div>

        {/* Doelstelling */}
        <div>
          <label className="block text-xs text-slate-400 mb-2">Wat is jouw persoonlijke doel?</label>
          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5">
            {Object.entries(GOAL_TYPES).map(([key, item]) => (
              <button
                type="button"
                key={key}
                onClick={() => handleBioChange('goalType', key)}
                className={`p-3 rounded-2xl border text-left text-xs font-semibold transition flex items-center justify-between ${
                  form.goalType === key
                    ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300'
                    : 'bg-slate-950 border-slate-800 text-slate-300 hover:border-slate-700'
                }`}
              >
                <span>{item.label}</span>
                {form.goalType === key && <Check className="w-4 h-4 text-emerald-400 shrink-0" />}
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* STAP 3: BEREKENDE OF HANDMATIGE MACRO DOELEN */}
      <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 sm:p-6 space-y-4">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-800">
          <div>
            <h3 className="text-base font-bold text-white flex items-center gap-2">
              <Flame className="w-5 h-5 text-emerald-400" />
              3. Jouw Dagelijkse Voedingsdoelen
            </h3>
            <p className="text-xs text-slate-400 mt-0.5">
              Laat ze automatisch op basis van je profiel berekenen of pas ze handmatig aan.
            </p>
          </div>

          <div className="flex bg-slate-950 p-1 rounded-xl border border-slate-800 self-start">
            <button
              type="button"
              onClick={() => handleToggleAutoCalculate(true)}
              className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                form.autoCalculate ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'
              }`}
            >
              Automatisch op maat
            </button>
            <button
              type="button"
              onClick={() => handleToggleAutoCalculate(false)}
              className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                !form.autoCalculate ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'
              }`}
            >
              Handmatig aanpassen
            </button>
          </div>
        </div>

        <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
          <div className="bg-slate-950 border border-slate-800 rounded-2xl p-3">
            <label className="block text-xs text-emerald-400 font-semibold mb-1">Calorieën (kcal)</label>
            <input
              type="number"
              disabled={form.autoCalculate}
              value={form.autoCalculate ? calculated.calorieGoal : form.calorieGoal}
              onChange={(e) => setForm({ ...form, calorieGoal: e.target.value })}
              className="w-full bg-slate-900 disabled:bg-slate-950 border border-slate-700 disabled:border-transparent rounded-xl px-2.5 py-1.5 text-base font-extrabold text-white"
            />
          </div>

          <div className="bg-slate-950 border border-slate-800 rounded-2xl p-3">
            <label className="block text-xs text-rose-400 font-semibold mb-1">Eiwitten (g)</label>
            <input
              type="number"
              disabled={form.autoCalculate}
              value={form.autoCalculate ? calculated.proteinGoal : form.proteinGoal}
              onChange={(e) => setForm({ ...form, proteinGoal: e.target.value })}
              className="w-full bg-slate-900 disabled:bg-slate-950 border border-slate-700 disabled:border-transparent rounded-xl px-2.5 py-1.5 text-base font-bold text-white"
            />
          </div>

          <div className="bg-slate-950 border border-slate-800 rounded-2xl p-3">
            <label className="block text-xs text-amber-400 font-semibold mb-1">Koolhydr. (g)</label>
            <input
              type="number"
              disabled={form.autoCalculate}
              value={form.autoCalculate ? calculated.carbsGoal : form.carbsGoal}
              onChange={(e) => setForm({ ...form, carbsGoal: e.target.value })}
              className="w-full bg-slate-900 disabled:bg-slate-950 border border-slate-700 disabled:border-transparent rounded-xl px-2.5 py-1.5 text-base font-bold text-white"
            />
          </div>

          <div className="bg-slate-950 border border-slate-800 rounded-2xl p-3">
            <label className="block text-xs text-violet-400 font-semibold mb-1">Vetten (g)</label>
            <input
              type="number"
              disabled={form.autoCalculate}
              value={form.autoCalculate ? calculated.fatGoal : form.fatGoal}
              onChange={(e) => setForm({ ...form, fatGoal: e.target.value })}
              className="w-full bg-slate-900 disabled:bg-slate-950 border border-slate-700 disabled:border-transparent rounded-xl px-2.5 py-1.5 text-base font-bold text-white"
            />
          </div>

          <div className="bg-slate-950 border border-slate-800 rounded-2xl p-3 col-span-2 sm:col-span-1">
            <label className="block text-xs text-sky-400 font-semibold mb-1">Water (ml)</label>
            <input
              type="number"
              disabled={form.autoCalculate}
              value={form.autoCalculate ? calculated.waterGoal : form.waterGoal}
              onChange={(e) => setForm({ ...form, waterGoal: e.target.value })}
              className="w-full bg-slate-900 disabled:bg-slate-950 border border-slate-700 disabled:border-transparent rounded-xl px-2.5 py-1.5 text-base font-bold text-white"
            />
          </div>
        </div>

        <button
          type="submit"
          className="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold py-3.5 px-6 rounded-2xl flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20 transition"
        >
          <CheckCircle2 className="w-5 h-5" /> Sla Mijn Persoonlijke Doelen Op
        </button>

        <button
          type="button"
          onClick={onOpenDownloadModal}
          className="w-full bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-300 font-semibold py-3 px-4 rounded-2xl flex items-center justify-center gap-2 text-xs transition"
        >
          <Download className="w-4 h-4 text-emerald-400" /> App Installeren of Dagboek Downloaden (.CSV / Back-up)
        </button>
      </div>
    </form>
  );
}

// ==========================================
// TAB 4: RECEPTEN ZOEKER & AI GENERATOR
// ==========================================
function RecipesView({
  profile,
  todayStats,
  savedRecipes,
  onLogRecipe,
  onSaveFavorite,
  onDeleteFavorite,
  showToast
}) {
  const [searchQuery, setSearchQuery] = useState("");
  const [activeFilter, setActiveFilter] = useState("Passend bij mijn dag");
  const [recipes, setRecipes] = useState(STARTER_RECIPES);
  const [isGenerating, setIsGenerating] = useState(false);
  const [selectedRecipe, setSelectedRecipe] = useState(null);
  const [viewTab, setViewTab] = useState('discover'); // 'discover' | 'favorites'

  const remainingMacros = {
    calories: Math.max(300, (profile.calorieGoal || 2200) - todayStats.calories),
    protein: Math.max(20, (profile.proteinGoal || 140) - todayStats.protein)
  };

  const filterChips = [
    "Passend bij mijn dag",
    "Snel & Eiwitrijk (< 15 min)",
    "Onder 500 kcal",
    "Gezonde Lunch",
    "Vegetarisch Krachtvoer",
    "Gezonde Avondsnack"
  ];

  const handleSearchRecipes = async (customFilter = activeFilter) => {
    setIsGenerating(true);
    try {
      const generated = await generateRecipesWithGemini(searchQuery, remainingMacros, customFilter);
      if (Array.isArray(generated) && generated.length > 0) {
        setRecipes(generated.map((r, i) => ({ ...r, id: `ai-rec-${Date.now()}-${i}` })));
        showToast("Nieuwe recepten op maat gegenereerd! 👨‍🍳");
      }
    } catch (err) {
      console.error(err);
      showToast(aiErrorMessage(err, "Kon even geen nieuwe recepten ophalen.").replace(" (bovenaan dit scherm)", " (via Maaltijd toevoegen → Typ & Bereken)"), "error");
    } finally {
      setIsGenerating(false);
    }
  };

  const displayedRecipes = viewTab === 'favorites' ? savedRecipes : recipes;

  return (
    <div className="space-y-6">
      {/* HEADER & ZOEKBALK */}
      <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 sm:p-6 space-y-4">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <h2 className="text-xl font-bold text-white flex items-center gap-2">
              <ChefHat className="w-6 h-6 text-emerald-400" /> Slimme Recepten Keuken
            </h2>
            <p className="text-xs sm:text-sm text-slate-400 mt-0.5">
              Zoek elk gerecht of laat recepten bedenken voor jouw resterende{' '}
              <span className="text-emerald-400 font-semibold">{remainingMacros.calories} kcal</span> &{' '}
              <span className="text-rose-400 font-semibold">{remainingMacros.protein}g eiwit</span>.
            </p>
          </div>

          <div className="flex bg-slate-950 p-1 rounded-xl border border-slate-800 self-start">
            <button
              onClick={() => setViewTab('discover')}
              className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                viewTab === 'discover' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'
              }`}
            >
              Ontdekken ({recipes.length})
            </button>
            <button
              onClick={() => setViewTab('favorites')}
              className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                viewTab === 'favorites' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'
              }`}
            >
              Mijn Favorieten ({savedRecipes.length})
            </button>
          </div>
        </div>

        {viewTab === 'discover' && (
          <>
            <div className="flex flex-col sm:flex-row gap-2">
              <div className="relative flex-1">
                <Search className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && handleSearchRecipes()}
                  placeholder="Waar heb je trek in? (bijv. 'kip pesto', 'wraps', 'pannenkoeken')..."
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500"
                />
              </div>
              <button
                onClick={() => handleSearchRecipes()}
                disabled={isGenerating}
                className="bg-emerald-500 hover:bg-emerald-400 disabled:opacity-50 text-slate-950 font-bold px-5 py-3 rounded-xl text-sm flex items-center justify-center gap-2 shrink-0 shadow-lg shadow-emerald-500/20 transition"
              >
                {isGenerating ? (
                  <>
                    <RefreshCw className="w-4 h-4 animate-spin" /> Bedenken...
                  </>
                ) : (
                  <>
                    <Sparkles className="w-4 h-4" /> Zoek / Genereer
                  </>
                )}
              </button>
            </div>

            {/* SNELLE FILTER CHIPS */}
            <div className="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar">
              {filterChips.map((chip) => (
                <button
                  key={chip}
                  onClick={() => {
                    setActiveFilter(chip);
                    handleSearchRecipes(chip);
                  }}
                  className={`text-xs px-3 py-1.5 rounded-xl whitespace-nowrap font-medium border transition ${
                    activeFilter === chip
                      ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300'
                      : 'bg-slate-950 border-slate-800 text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {chip}
                </button>
              ))}
            </div>
          </>
        )}
      </div>

      {/* RECEPTEN LIJST */}
      {displayedRecipes.length === 0 ? (
        <div className="bg-slate-900 border border-slate-800 rounded-3xl p-10 text-center space-y-2">
          <Bookmark className="w-8 h-8 text-slate-500 mx-auto" />
          <h3 className="font-bold text-white">Nog geen opgeslagen recepten</h3>
          <p className="text-xs text-slate-400">Bewaar je favoriete recepten zodat je ze altijd snel kunt klaarmaken.</p>
        </div>
      ) : (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
          {displayedRecipes.map((rec) => (
            <div
              key={rec.id || rec.title}
              className="bg-slate-900 border border-slate-800 hover:border-emerald-500/40 rounded-3xl p-5 flex flex-col justify-between transition group"
            >
              <div>
                <div className="flex items-center justify-between gap-2 mb-2">
                  <span className="text-[11px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400">
                    {rec.mealType}
                  </span>
                  <span className="text-xs text-slate-400 flex items-center gap-1">
                    <Clock className="w-3.5 h-3.5" /> {rec.prepTimeMinutes} min
                  </span>
                </div>

                <h3 className="font-bold text-white text-base group-hover:text-emerald-300 transition">
                  {rec.title}
                </h3>
                <p className="text-xs text-slate-400 mt-1.5 line-clamp-2 leading-relaxed">
                  {rec.shortDescription}
                </p>

                {/* MACRO BADGES */}
                <div className="grid grid-cols-4 gap-1.5 my-4 bg-slate-950 p-2.5 rounded-2xl border border-slate-800/80 text-center">
                  <div>
                    <div className="text-xs font-extrabold text-emerald-400">{rec.calories}</div>
                    <div className="text-[10px] text-slate-500">kcal</div>
                  </div>
                  <div>
                    <div className="text-xs font-bold text-rose-400">{rec.protein}g</div>
                    <div className="text-[10px] text-slate-500">eiwit</div>
                  </div>
                  <div>
                    <div className="text-xs font-bold text-amber-400">{rec.carbs}g</div>
                    <div className="text-[10px] text-slate-500">koolh</div>
                  </div>
                  <div>
                    <div className="text-xs font-bold text-violet-400">{rec.fat}g</div>
                    <div className="text-[10px] text-slate-500">vet</div>
                  </div>
                </div>
              </div>

              <div className="space-y-2 pt-2">
                <button
                  onClick={() => setSelectedRecipe(rec)}
                  className="w-full bg-slate-800 hover:bg-slate-700 text-white font-semibold text-xs py-2.5 px-4 rounded-xl transition"
                >
                  Bekijk Ingrediënten & Bereiding
                </button>
                <div className="flex gap-2">
                  <button
                    onClick={() => onLogRecipe(rec)}
                    className="flex-1 bg-emerald-500/20 hover:bg-emerald-500 text-emerald-300 hover:text-slate-950 font-semibold text-xs py-2 px-3 rounded-xl transition flex items-center justify-center gap-1"
                  >
                    <Plus className="w-3.5 h-3.5" /> Log in Dagboek
                  </button>
                  {viewTab === 'favorites' ? (
                    <button
                      onClick={() => onDeleteFavorite(rec.id)}
                      className="p-2 bg-rose-500/15 hover:bg-rose-500/30 text-rose-400 rounded-xl transition"
                      title="Verwijder uit favorieten"
                    >
                      <Trash2 className="w-4 h-4" />
                    </button>
                  ) : (
                    <button
                      onClick={() => onSaveFavorite(rec)}
                      className="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition"
                      title="Bewaar in favorieten"
                    >
                      <Bookmark className="w-4 h-4" />
                    </button>
                  )}
                </div>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* DETAIL MODAL VOOR RECEPT BEREIDING */}
      {selectedRecipe && (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-xl w-full max-h-[88vh] overflow-y-auto p-6 space-y-5 shadow-2xl">
            <div className="flex items-start justify-between gap-4">
              <div>
                <span className="text-xs font-bold uppercase text-emerald-400">
                  {selectedRecipe.mealType} • {selectedRecipe.prepTimeMinutes} minuten
                </span>
                <h3 className="text-xl font-bold text-white mt-0.5">{selectedRecipe.title}</h3>
              </div>
              <button
                onClick={() => setSelectedRecipe(null)}
                className="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl"
              >
                <X className="w-5 h-5" />
              </button>
            </div>

            <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">{selectedRecipe.shortDescription}</p>

            {/* Macro Samenvatting */}
            <div className="grid grid-cols-4 gap-2 bg-slate-950 p-3.5 rounded-2xl border border-slate-800 text-center">
              <div>
                <div className="text-base font-extrabold text-emerald-400">{selectedRecipe.calories}</div>
                <div className="text-xs text-slate-400">Calorieën</div>
              </div>
              <div>
                <div className="text-base font-bold text-rose-400">{selectedRecipe.protein}g</div>
                <div className="text-xs text-slate-400">Eiwitten</div>
              </div>
              <div>
                <div className="text-base font-bold text-amber-400">{selectedRecipe.carbs}g</div>
                <div className="text-xs text-slate-400">Koolhydr.</div>
              </div>
              <div>
                <div className="text-base font-bold text-violet-400">{selectedRecipe.fat}g</div>
                <div className="text-xs text-slate-400">Vetten</div>
              </div>
            </div>

            {/* Ingrediënten */}
            <div>
              <h4 className="font-bold text-white text-sm mb-2.5">Ingrediënten (1 persoon)</h4>
              <ul className="space-y-1.5 bg-slate-950/60 p-4 rounded-2xl border border-slate-800">
                {selectedRecipe.ingredients?.map((ing, i) => (
                  <li key={i} className="text-xs sm:text-sm text-slate-200 flex items-center gap-2">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400" />
                    {ing}
                  </li>
                ))}
              </ul>
            </div>

            {/* Bereidingsstappen */}
            <div>
              <h4 className="font-bold text-white text-sm mb-2.5">Bereidingswijze</h4>
              <ol className="space-y-3">
                {selectedRecipe.instructions?.map((step, i) => (
                  <li key={i} className="flex gap-3 text-xs sm:text-sm text-slate-300 leading-relaxed">
                    <span className="w-6 h-6 rounded-lg bg-emerald-500/20 text-emerald-400 font-bold flex items-center justify-center shrink-0 text-xs">
                      {i + 1}
                    </span>
                    <span>{step}</span>
                  </li>
                ))}
              </ol>
            </div>

            <div className="flex gap-3 pt-2">
              <button
                onClick={() => {
                  onLogRecipe(selectedRecipe);
                  setSelectedRecipe(null);
                }}
                className="flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 px-4 rounded-2xl text-sm flex items-center justify-center gap-2 transition"
              >
                <CheckCircle2 className="w-4 h-4" /> Klaargemaakt? Voeg toe aan dagboek
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ==========================================
// APP STARTEN
// ==========================================
import { createRoot } from 'react-dom/client';
createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
